<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14243a">
    <title>Shoe Counter AI — Gestión de la tienda</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="logo"><img src="assets/logo.svg" alt="" width="30" height="30"><span>Shoe Counter AI</span></div>
        <nav class="nav" id="nav"></nav>
        <div class="foot">Tienda de calzado · v1</div>
      </aside>
      <div class="nav-backdrop" id="nav-backdrop"></div>
      <div class="main">
        <header class="topbar">
          <div class="left">
            <button class="btn ghost menu-btn" id="menu-btn" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"></button>
            <strong id="page-title">Cargando…</strong>
          </div>
          <div class="user" id="user-box"></div>
        </header>
        <main class="content" id="view" tabindex="-1">
          <div class="loading"><span class="spinner"></span> Comprobando la sesión…</div>
        </main>
      </div>
    </div>
  </body>
</html>
